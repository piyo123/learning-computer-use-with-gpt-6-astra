<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>動画一覧</title>

  <style>
    body {
      font-family: sans-serif;
      margin: 40px;
    }

    .video-list a {
      display: block;
      margin: 12px 0;
      color: #0066cc;
      text-decoration: none;
    }

    .video-list a:hover {
      text-decoration: underline;
    }

    /* モーダル背景 */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
    }

    /* 動画表示領域 */
    .modal-content {
      position: relative;
      width: 90%;
      max-width: 1200px;
    }

    video {
      display: block;
      width: 100%;
      max-height: 85vh;
      background: black;
    }

    /* 閉じるボタン */
    .close {
      position: absolute;
      top: -45px;
      right: 0;
      color: white;
      font-size: 36px;
      cursor: pointer;
      user-select: none;
    }
  </style>
</head>

<body>

  <h1>動画一覧</h1>

  <div class="video-list">
    <a href="?video=1" data-video="1">Playwright - Wikipedia で織田信長の没年取得</a>
    <a href="?video=2" data-video="2">Playwright - かぐや姫の出自</a>
    <a href="?video=3" data-video="3">Playwright - Web 入力</a>
    <a href="?video=4" data-video="4">PyAutoGUI - Wikipedia で織田信長の没年取得</a>
    <a href="?video=5" data-video="5">PyAutoGUI - かぐや姫の出自</a>
    <a href="?video=6" data-video="6">PyAutoGUI - Web 入力</a>
    <a href="?video=7" data-video="7">PyAutoGUI - Windows Form の操作</a>
  </div>


  <!-- 動画モーダル -->
  <div id="videoModal" class="modal">
    <div class="modal-content">

      <span class="close" id="closeButton">&times;</span>

      <video id="videoPlayer" controls>
        <source id="videoSource" type="video/mp4">
      </video>

    </div>
  </div>


  <script>
    // 動画IDとファイルの対応
    const videos = {
      1: "./assets/playwright_oda.mp4",
      2: "./assets/playwright_otogi.mp4",
      3: "./assets/playwright_input1.mp4",
      4: "./assets/pyautogui_oda.mp4",
      5: "./assets/pyautogui_otogi.mp4",
      6: "./assets/pyautogui_input1.mp4",
      7: "./assets/pyautogui_winform.mp4"
    };

    const modal = document.getElementById("videoModal");
    const player = document.getElementById("videoPlayer");
    const source = document.getElementById("videoSource");
    const closeButton = document.getElementById("closeButton");


    // 動画を開く
    function openVideo(videoId, updateHistory = true) {

      const videoUrl = videos[videoId];

      if (!videoUrl) {
        return;
      }

      source.src = videoUrl;
      player.load();

      modal.style.display = "flex";

      // URLを ?video=x に変更
      if (updateHistory) {
        const url = new URL(window.location.href);
        url.searchParams.set("video", videoId);

        history.pushState(
          { video: videoId },
          "",
          url
        );
      }

      // ユーザーのクリックから呼ばれた場合は通常そのまま再生できる
      player.play().catch(() => {
        // URLから直接開いた場合などは
        // ブラウザによって自動再生がブロックされることがあります
      });
    }


    // 動画を閉じる
    function closeVideo(updateHistory = true) {

      player.pause();
      player.currentTime = 0;

      source.removeAttribute("src");
      player.load();

      modal.style.display = "none";

      if (updateHistory) {
        const url = new URL(window.location.href);
        url.searchParams.delete("video");

        history.pushState({}, "", url);
      }
    }


    // 動画リンク
    document.querySelectorAll("[data-video]").forEach(link => {

      link.addEventListener("click", function(event) {

        // 通常のページ遷移を止める
        event.preventDefault();

        const videoId = this.dataset.video;

        openVideo(videoId);
      });

    });


    // ×ボタン
    closeButton.addEventListener("click", function() {
      closeVideo();
    });


    // モーダル背景クリック
    modal.addEventListener("click", function(event) {

      if (event.target === modal) {
        closeVideo();
      }

    });


    // Escキーでも閉じる
    document.addEventListener("keydown", function(event) {

      if (
        event.key === "Escape" &&
        modal.style.display === "flex"
      ) {
        closeVideo();
      }

    });


    // URLから動画IDを取得
    function loadFromUrl() {

      const params = new URLSearchParams(window.location.search);
      const videoId = params.get("video");

      if (videoId && videos[videoId]) {
        openVideo(videoId, false);
      } else {
        closeVideo(false);
      }
    }


    // ブラウザの「戻る」「進む」に対応
    window.addEventListener("popstate", function() {
      loadFromUrl();
    });


    // 初回表示
    loadFromUrl();

  </script>

</body>
</html>
