<html>
    <head>
        <script type="text/javascript">
            function a(str) {
                if (str == "OK")
                    document.getElementById("output").innerHTML = '<span style="font-size:14pt;color:blue">' + str + '</span>';
                else
                        document.getElementById("output").innerHTML = '<span style="font-size:14pt;color:red">' + str + '</span>';
            }

            document.addEventListener("DOMContentLoaded", () => {
                    document.getElementById("button1").addEventListener("click", () => a("OK"));
                    document.getElementById("button2").addEventListener("click", () => a("NG"));
                }
            )
        </script>
    </head>
    <body>
        <input id="text_a" type="text"><br>
        <input id="text_b" type="text"><br>
        <input id="text_c" type="text"><br>
        <input id="text_d" type="text"><br>
        <input id="text_e" type="text"><br>
        <input id="button1" type="button" style="background-color: aqua;" value="Done">
        <input id="button2" type="button" style="background-color: orange;" value="Done">
        <div id="output"></div>
    </body>
</html>
